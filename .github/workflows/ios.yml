name: iOS build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Upload a signed build to TestFlight
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test game
        run: node --test Game/*.test.mjs
      - name: Bundle offline game
        run: node Scripts/build-game.mjs
      - name: Build iPhone simulator app
        run: |
          xcodebuild -version
          xcodebuild -project YakyuGame.xcodeproj -scheme YakyuGame -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v6
        with:
          name: YakyuGame-simulator
          path: build/Build/Products/Debug-iphonesimulator/YakyuGame.app
          if-no-files-found: error
  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight && github.ref == 'refs/heads/main'
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    concurrency:
      group: testflight
      cancel-in-progress: false
    env:
      IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
      IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Check signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in IOS_DISTRIBUTION_P12_BASE64 IOS_DISTRIBUTION_P12_PASSWORD IOS_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY_P8; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
      - name: Bundle offline game
        run: node Scripts/build-game.mjs
      - name: Install signing materials
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os, base64, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          (root / 'certificate.p12').write_bytes(base64.b64decode(os.environ['IOS_DISTRIBUTION_P12_BASE64'], validate=True))
          (root / 'profile.mobileprovision').write_bytes(base64.b64decode(os.environ['IOS_PROFILE_BASE64'], validate=True))
          key = root / 'private_keys'
          key.mkdir(exist_ok=True)
          (key / ('AuthKey_' + os.environ['ASC_KEY_ID'] + '.p8')).write_text(os.environ['ASC_PRIVATE_KEY_P8'])
          PY
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import os, plistlib, pathlib, datetime, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          profile = plistlib.loads((root / 'profile.plist').read_bytes())
          team = 'R3233N87DC'
          bundle = 'com.yakyugame.app'
          assert profile['TeamIdentifier'] == [team], 'Wrong signing team'
          assert profile['Entitlements']['application-identifier'] == team + '.' + bundle, 'Wrong profile bundle ID'
          assert not profile['Entitlements'].get('get-task-allow', False), 'Development profile cannot be used'
          assert 'ProvisionedDevices' not in profile and not profile.get('ProvisionsAllDevices', False), 'App Store distribution profile required'
          assert profile['ExpirationDate'] > datetime.datetime.now(datetime.timezone.utc).replace(tzinfo=None), 'Profile expired'
          uuid = profile['UUID']
          for folder in ['Library/MobileDevice/Provisioning Profiles', 'Library/Developer/Xcode/UserData/Provisioning Profiles']:
              dest = pathlib.Path.home() / folder
              dest.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(root / 'profile.mobileprovision', dest / (uuid + '.mobileprovision'))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('PROFILE_UUID=' + uuid + '\n')
          options = dict(method='app-store-connect', signingStyle='manual', teamID=team, provisioningProfiles={bundle: uuid}, uploadSymbols=True)
          (root / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/signing.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/signing.keychain-db"
          security import "$RUNNER_TEMP/certificate.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/signing.keychain-db"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$RUNNER_TEMP/signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" "$HOME/Library/Keychains/login.keychain-db"
      - name: Archive signed device app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project YakyuGame.xcodeproj -scheme YakyuGame -configuration Release -destination 'generic/platform=iOS' -archivePath build/YakyuGame.xcarchive DEVELOPMENT_TEAM=R3233N87DC CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='iPhone Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
          xcodebuild -exportArchive -archivePath build/YakyuGame.xcarchive -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export
      - name: Validate and upload to App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          xcrun altool --validate-app --type ios --file build/export/YakyuGame.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          xcrun altool --upload-app --type ios --file build/export/YakyuGame.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove signing materials
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          python3 - <<'PY'
          import os, pathlib, shutil
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ['certificate.p12', 'profile.mobileprovision', 'profile.plist', 'ExportOptions.plist']:
              (root / name).unlink(missing_ok=True)
          shutil.rmtree(root / 'private_keys', ignore_errors=True)
          uuid = os.environ.get('PROFILE_UUID')
          if uuid:
              for folder in ['Library/MobileDevice/Provisioning Profiles', 'Library/Developer/Xcode/UserData/Provisioning Profiles']:
                  (pathlib.Path.home() / folder / (uuid + '.mobileprovision')).unlink(missing_ok=True)
          PY
